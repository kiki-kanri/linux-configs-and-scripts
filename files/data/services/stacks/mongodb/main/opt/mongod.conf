storage:
  dbPath: /data/db

systemLog:
  verbosity: 0

net:
  bindIpAll: true
  port: 27017

replication:
  replSetName: rs0

security:
  # authorization: enabled
  javascriptEnabled: false
  # keyFile: /data/configdb/keyfile

operationProfiling:
  mode: off

setParameter:
  # Local diagnostics only; retain FTDC for troubleshooting.
  diagnosticDataCollectionEnabled: true
  # Keep MongoDB 9.0's default 1% read and write query stats sampling.
  internalQueryStatsSampleRate: 0.01
  internalQueryStatsWriteCmdSampleRate: 0.01
