services:
  phpmyadmin:
    container_name: phpmyadmin
    environment:
      HIDE_PHP_VERSION: 'true'
      PMA_ARBITRARY: '1'
      PMA_HOST: mariadb-main
      TZ: UTC
    image: 'phpmyadmin:5-apache'
    logging:
      driver: json-file
      options:
        max-file: '2'
        max-size: 10m
    ports:
      - '${PHPMYADMIN_EXPOSE_HOST:?must be set}:${PHPMYADMIN_EXPOSE_PORT:?must be set}:80'
    restart: always
