# Each jail owns its deny file, so an unban cannot remove another jail's ban.
# Server/location allow or deny directives can override inherited http-level rules.
[Definition]
# Clear stale bans even when no active database bans remain to trigger startup.
actionstart_on_demand = false
actionstart = truncate -s 0 '<blockfile>' && chmod 644 '<blockfile>' && %(_reload)s
actioncheck = test -f '<blockfile>'
actionban = { grep -qxF 'deny <ip>;' '<blockfile>' || echo 'deny <ip>;' >> '<blockfile>'; } && %(_reload)s
# Match IP addresses literally, including dots in IPv4 addresses.
actionunban = escaped_ip=$(echo '<ip>' | sed 's/[.]/[.]/g') && sed -i "\#^deny ${escaped_ip};\$#d" '<blockfile>' && %(_reload)s
# Fail2Ban restores still-valid bans from its database after a restart.
actionflush = truncate -s 0 '<blockfile>' && %(_reload)s
actionstop =

# A stopped nginx.service reads the updated files on its next start.
_reload = <nginxcmd> -t && if systemctl is-active --quiet nginx.service; then <nginxcmd> -s reload; fi

[Init]
name = default
blockfile = /etc/nginx/conf.d/fail2ban-<name>.conf
nginxcmd = /usr/sbin/nginx
