# Kernel security baseline for Ubuntu 24.04/26.04 and Debian 12/13/PVE hosts.
# Managed by linux-configs-and-scripts; reapplied on every setup/sync and at boot.
# Late filename also overrides Debian 12's usual 99-sysctl.conf drop-in.
# Sources:
# https://docs.kernel.org/admin-guide/sysctl/kernel.html
# https://docs.kernel.org/admin-guide/LSM/Yama.html
# https://docs.kernel.org/admin-guide/sysctl/fs.html
# https://docs.kernel.org/admin-guide/sysctl/vm.html

# Restrict kernel logs, kernel pointer disclosure and unprivileged BPF.
# BPF value 2 disables unprivileged access but remains reversible by an admin.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.unprivileged_bpf_disabled = 2

# Restrict ptrace attachment while retaining parent/child debugging and root access.
kernel.yama.ptrace_scope = 1

# Enable full userspace ASLR, including the heap, and block low-address mappings.
kernel.randomize_va_space = 2
vm.mmap_min_addr = 65536

# Protect shared temporary directories from link/FIFO/file replacement attacks.
# Value 2 extends FIFO/regular-file protection to group-writable sticky directories.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

# Do not dump memory from setuid or otherwise privilege-transitioned processes.
# This does not disable core dumps for ordinary application processes.
fs.suid_dumpable = 0

# Deliberately do not disable user namespaces, io_uring, modules or kexec,
# and do not change forwarding, bridge filtering, IPv6 or reverse-path filtering.
# Those require workload-specific policies for containers, VMs, networking and recovery.

# TEMP
# https://docs.kernel.org/networking/mptcp-sysctl.html
# https://docs.kernel.org/networking/ip-sysctl.html
# Temporary exposure reduction for CVE-2026-98432, not a substitute for a patched kernel.
# Disabling MPTCP creation does not close existing sockets; check each network namespace.
# tcp_migrate_req=0 does not disable migration driven by a reuseport BPF program.
net.mptcp.enabled = 0
net.ipv4.tcp_migrate_req = 0
