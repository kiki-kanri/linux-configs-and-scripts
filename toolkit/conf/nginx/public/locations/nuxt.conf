# Serves Nuxt build assets from disk; requires `root <app>/.output/public;` in the server block.
# App manifest of a specific build; content never changes.
location ^~ /_nuxt/builds/meta/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# builds/latest.json changes on every deploy; revalidate with ETag/Last-Modified.
location ^~ /_nuxt/builds/ {
    add_header Cache-Control "no-cache";
}

# Content-hashed build assets.
location ^~ /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Robots-Tag "noindex";
}
